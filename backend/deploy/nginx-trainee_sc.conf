# Add inside the existing `server { ... }` block for epid-odpc2.ddc.moph.go.th (443/ssl).
# The app's basePath is /trainee_sc, so the path is passed through unchanged:
#   https://epid-odpc2.ddc.moph.go.th/trainee_sc          -> API info
#   https://epid-odpc2.ddc.moph.go.th/trainee_sc/api/...  -> API endpoints
location = /trainee_sc {
    proxy_pass http://127.0.0.1:3001;
}

location /trainee_sc/ {
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    client_max_body_size 5m;
}
